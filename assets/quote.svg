      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0c111e" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="q-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.4" />
