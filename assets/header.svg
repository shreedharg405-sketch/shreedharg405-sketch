<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" height="250">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814" />
      <stop offset="50%" stop-color="#071322" />
      <stop offset="100%" stop-color="#04181a" />
    </linearGradient>

    <!-- Animated Neon Cyan-Mint Gradient -->
    <linearGradient id="neon-cyan-mint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#00f2fe" />
      <animate attributeName="x1" from="-100%" to="100%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.6" />
    </linearGradient>

    <!-- Header Bar Gradient -->
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#082f49" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.7" />
    </linearGradient>

    <!-- Glow Filter for Text -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ambient Blur Filter -->
    <filter id="ambient-glow">
      <feGaussianBlur stdDeviation="45" />
    </filter>

    <!-- Hexagonal Matrix Pattern -->
    <pattern id="circuit-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#06b6d4" stroke-width="0.6" stroke-opacity="0.09" />
      <circle cx="0" cy="0" r="1.5" fill="#10b981" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .name-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      font-weight: 900;
      font-size: 48px;
      letter-spacing: 6px;
      text-transform: uppercase;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }
    .mono-pill {
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      fill: #a7f3d0;
    }
    .pulse-green {
      animation: pulseGreen 2.2s infinite ease-in-out;
    }
    @keyframes pulseGreen {
      0% { opacity: 0.3; r: 4px; }
      50% { opacity: 1; r: 6px; }
      100% { opacity: 0.3; r: 4px; }
    }
  </style>

  <!-- Base Rounded Card -->
  <rect width="920" height="250" rx="16" fill="url(#bg-cyber)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="180" cy="90" r="110" fill="#0284c7" opacity="0.16" filter="url(#ambient-glow)" />
  <circle cx="740" cy="140" r="120" fill="#10b981" opacity="0.14" filter="url(#ambient-glow)" />

  <!-- Subtle Circuit Grid Pattern Overlay -->
  <rect width="920" height="250" rx="16" fill="url(#circuit-grid)" />

  <!-- Outer Glowing Gradient Border -->
  <rect x="1.5" y="1.5" width="917" height="247" rx="15" fill="none" stroke="url(#border-glow)" stroke-width="1.8" />

  <!-- Top Window Header Deck -->
  <path d="M 2 16 Q 2 2 16 2 L 904 2 Q 918 2 918 16 L 918 36 L 2 36 Z" fill="url(#bar-grad)" stroke="#1e293b" stroke-width="0.8" />

  <!-- Window Control Dots -->
  <circle cx="22" cy="19" r="5" fill="#f43f5e" opacity="0.9" />
  <circle cx="38" cy="19" r="5" fill="#f59e0b" opacity="0.9" />
  <circle cx="54" cy="19" r="5" fill="#10b981" opacity="0.9" />

  <!-- Terminal Path in Top Deck -->
  <text x="76" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" letter-spacing="0.5">
    shreedhar@quantum-core:~/systems/profile.sh
  </text>

  <!-- Live Pulse Status Badge in Deck -->
  <g transform="translate(685, 9)">
    <rect width="215" height="20" rx="10" fill="#022c22" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.8" />
    <circle cx="14" cy="10" r="4.5" fill="#10b981" class="pulse-green" />
    <text x="118" y="14" text-anchor="middle" class="mono-pill">STATUS: SYSTEM OPTIMAL</text>
  </g>

  <!-- Cybernetic Corner Geometry -->
  <!-- Top Left -->
  <path d="M 12 48 L 12 40 L 28 40" stroke="#00f2fe" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Top Right -->
  <path d="M 908 48 L 908 40 L 892 40" stroke="#34d399" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Bottom Left -->
  <path d="M 12 218 L 12 238 L 32 238" stroke="#00f2fe" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Bottom Right -->
  <path d="M 908 218 L 908 238 L 888 238" stroke="#34d399" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Main Name Header -->
  <text x="460" y="112" text-anchor="middle" class="name-text" fill="url(#neon-cyan-mint)" filter="url(#glow-cyan)">
    SHREEDHAR G
  </text>
  <text x="460" y="112" text-anchor="middle" class="name-text" fill="#ffffff" fill-opacity="0.95">
    SHREEDHAR G
  </text>

  <!-- Core Tagline Subtitle -->
  <text x="460" y="152" text-anchor="middle" class="sub-text">
    <tspan fill="#38bdf8">ELECTRONICS &amp; COMMUNICATION</tspan>
    <tspan fill="#64748b"> // </tspan>
    <tspan fill="#f8fafc">FULL-STACK CLOUD</tspan>
    <tspan fill="#64748b"> // </tspan>
    <tspan fill="#34d399">EMBEDDED SYSTEMS &amp; IoT</tspan>
  </text>

  <!-- Futuristic Dividing Line with Glowing Nodes -->
  <g transform="translate(0, 172)">
    <line x1="160" y1="0" x2="420" y2="0" stroke="url(#border-glow)" stroke-width="1.4" stroke-opacity="0.8" />
    <polygon points="460,-5 466,0 460,5 454,0" fill="#38bdf8" filter="url(#glow-cyan)" />
    <circle cx="438" cy="0" r="2" fill="#10b981" />
    <circle cx="482" cy="0" r="2" fill="#10b981" />
    <line x1="500" y1="0" x2="760" y2="0" stroke="url(#border-glow)" stroke-width="1.4" stroke-opacity="0.8" />
  </g>

  <!-- Telemetry Meta Bar at Bottom -->
  <g transform="translate(460, 212)">
    <rect x="-350" y="-16" width="700" height="28" rx="14" fill="#071822" stroke="#1e293b" stroke-width="1" />
    <text text-anchor="middle" y="3" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#cbd5e1" letter-spacing="1.2">
      <tspan fill="#38bdf8">&gt;_</tspan> RE-ENGINEERING IDEAS INTO <tspan fill="#34d399">INTELLIGENT EDGE &amp; CLOUD SYSTEMS</tspan>
    </text>
  </g>
</svg>
