<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 130" width="100%" height="130">
  <defs>
    <linearGradient id="q-cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a16" />
      <stop offset="50%" stop-color="#081524" />
      <stop offset="100%" stop-color="#041217" />
    </linearGradient>
    <linearGradient id="q-cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="q-glow-cyan">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Box -->
  <rect width="840" height="130" rx="12" fill="url(#q-cyber-bg)" stroke="url(#q-cyan-grad)" stroke-width="1.3" />

  <!-- Corner Terminal Brackets -->
  <path d="M 10 24 L 10 10 L 24 10" stroke="#00f2fe" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 830 24 L 830 10 L 816 10" stroke="#34d399" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 10 106 L 10 120 L 24 120" stroke="#00f2fe" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 830 106 L 830 120 L 816 120" stroke="#34d399" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Mini Header Tag -->
  <text x="34" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">
    // PHILOSOPHY_CORE :: ENGINEERING_MINDSET
  </text>

  <!-- Big Quote Icon -->
  <text x="34" y="68" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#00f2fe" opacity="0.9" filter="url(#q-glow-cyan)">&#8220;</text>

  <!-- Quote Text -->
  <text x="70" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-style="italic" font-weight="500" fill="#f1f5f9">
    &#8220;Engineering is the art of bridging physical silicon with scalable cloud intelligence &#8212; turning ideas into reality.&#8221;
  </text>

  <!-- Attribution -->
  <text x="790" y="98" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#34d399" letter-spacing="0.8">
    &#8212; Shreedhar G
  </text>
</svg>
