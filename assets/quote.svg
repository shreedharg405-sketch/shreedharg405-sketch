  <!-- Clean Quote Prose -->
  <text x="68" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-style="italic" font-weight="500" fill="#f1f5f9">
