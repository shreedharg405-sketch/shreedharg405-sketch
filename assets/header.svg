<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="220">
  <defs>
    <!-- Deep Obsidian Slate Background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0d111d" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Crisp Metallic Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Subtle Minimalist Border -->
    <linearGradient id="border-subtle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6" />
    </linearGradient>

    <!-- Sleek Line Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0" />
      <stop offset="25%" stop-color="#6366f1" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#818cf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Natural Crisp Shadow (No Fuzzy Neon) -->
    <filter id="crisp-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <!-- Soft Aurora Defused Ambient Glow -->
    <filter id="aurora-blur">
      <feGaussianBlur stdDeviation="55" />
    </filter>
  </defs>

  <style>
    .title-name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: 6px;
      text-transform: uppercase;
    }
    .subtitle-track {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 13.5px;
      letter-spacing: 2.2px;
      text-transform: uppercase;
    }
    .mono-label {
      font-family: "JetBrains Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.8px;
    }
  </style>

  <!-- Base Smooth Background -->
  <rect width="920" height="220" rx="16" fill="url(#bg-grad)" />

  <!-- Smooth Aurora Orbs (Zero static dots / zero visual noise) -->
  <ellipse cx="260" cy="85" rx="240" ry="75" fill="#4f46e5" opacity="0.18" filter="url(#aurora-blur)" />
  <ellipse cx="680" cy="135" rx="220" ry="65" fill="#0284c7" opacity="0.15" filter="url(#aurora-blur)" />

  <!-- Crisp Outer Border -->
  <rect x="1" y="1" width="918" height="218" rx="15" fill="none" stroke="url(#border-subtle)" stroke-width="1.2" />

  <!-- Minimalist Deck Header -->
  <path d="M 1 16 Q 1 1 16 1 L 904 1 Q 919 1 919 16 L 919 34 L 1 34 Z" fill="#0b1120" fill-opacity="0.75" stroke="#1e293b" stroke-width="0.8" />

  <!-- Muted Deck Dots -->
  <circle cx="22" cy="17" r="4.5" fill="#f43f5e" opacity="0.7" />
  <circle cx="36" cy="17" r="4.5" fill="#f59e0b" opacity="0.7" />
  <circle cx="50" cy="17" r="4.5" fill="#10b981" opacity="0.7" />

  <!-- Clean Deck Path -->
  <text x="70" y="21" class="mono-label" fill="#64748b">
    shreedhar.dev <tspan fill="#334155">/</tspan> workspace
  </text>

  <!-- Status Capsule in Deck -->
  <g transform="translate(730, 8)">
    <rect width="170" height="18" rx="9" fill="#1e1b4b" stroke="#4338ca" stroke-width="0.8" stroke-opacity="0.8" />
    <circle cx="12" cy="9" r="3.5" fill="#818cf8" />
    <text x="94" y="13" text-anchor="middle" class="mono-label" fill="#c7d2fe" font-weight="600">SYSTEM OPTIMAL</text>
  </g>

  <!-- Main Name: Crisp, Elegant, High-Definition Typography -->
  <text x="460" y="105" text-anchor="middle" class="title-name" fill="url(#title-grad)" filter="url(#crisp-shadow)">
    SHREEDHAR G
  </text>

  <!-- Tagline Subtitle -->
  <text x="460" y="142" text-anchor="middle" class="subtitle-track">
    <tspan fill="#818cf8">FULL-STACK CLOUD</tspan>
    <tspan fill="#475569"> &#8226; </tspan>
    <tspan fill="#e2e8f0">ELECTRONICS &amp; COMMUNICATION</tspan>
    <tspan fill="#475569"> &#8226; </tspan>
    <tspan fill="#38bdf8">EMBEDDED SYSTEMS &amp; IoT</tspan>
  </text>

  <!-- Minimalist Divider with Center Jewel -->
  <g transform="translate(0, 160)">
    <line x1="180" y1="0" x2="740" y2="0" stroke="url(#line-grad)" stroke-width="1.2" />
    <polygon points="460,-4 464,0 460,4 456,0" fill="#38bdf8" />
  </g>

  <!-- Bottom Purpose Line -->
  <g transform="translate(460, 192)">
    <text text-anchor="middle" class="mono-label" fill="#94a3b8">
      ENGINEERING SCALABLE WEB PLATFORMS &amp; INTELLIGENT HARDWARE SYSTEMS
    </text>
  </g>
</svg>
